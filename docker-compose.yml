# ─────────────────────────────────────────────────────────────────────────────
# CuraBook — Docker Compose (Production Monorepo)
#
# Services:
#   db              → PostgreSQL 16
#   redis           → Redis 7
#   web             → Django + Daphne (HTTP + WebSocket)
#   celery_worker   → Background task processor
#   celery_beat     → Periodic task scheduler
#   nginx           → Reverse proxy + SSL + React SPA
#   frontend_build  → React build (profile=build, run manually)
#   prometheus      → Metrics scraper
#   grafana         → Monitoring dashboards
#
# Usage:
#   Start all:         docker-compose up --build
#   Build frontend:    docker-compose --profile build run --rm frontend_build
#   Production:        docker-compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:              ${DB_NAME:-curabook_db}
      POSTGRES_USER:            ${DB_USER:-curabook_user}
      POSTGRES_PASSWORD:        ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS:     "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-curabook_user} -d ${DB_NAME:-curabook_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - curabook_net

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - curabook_net

  # ── Django / Daphne (HTTP + WebSocket) ──────────────────────────────────────
  web:
    build:
      context: ./backend          # ← Django project root
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST:    db
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-curabook.settings.dev}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs
      - backup_data:/app/backups
      # F-12 FIX: Mount JWT RSA keys read-only into the container.
      # Keys are stored in backend/certs/ (generated by scripts/generate_jwt_keys.py).
      # In production, replace with Docker secrets or a secrets-manager volume.
      - ./backend/certs/jwt_private_key.pem:/app/certs/jwt_private_key.pem:ro
      - ./backend/certs/jwt_public_key.pem:/app/certs/jwt_public_key.pem:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"          # Internal only — NGINX proxies to this
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=8); sys.exit(0)\" 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 120s
    networks:
      - curabook_net

  # ── NGINX (Reverse Proxy + SSL + React SPA) ──────────────────────────────────
  #
  # SSL setup (run once on the host before starting production):
  #   sudo certbot certonly --standalone -d yourdomain.com -d www.yourdomain.com
  #   Then set DOMAIN=yourdomain.com in .env
  #
  # The nginx.conf requires certificates at:
  #   /etc/letsencrypt/live/<domain>/fullchain.pem
  #   /etc/letsencrypt/live/<domain>/privkey.pem
  #
  # For local dev use docker-compose.dev.yml — it swaps to nginx.dev.conf (HTTP only).
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "3080:80"     # HTTP  → http://localhost:3080
      #- "3443:443"    # HTTPS → https://localhost:3443
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro  # DEV: HTTP only (no SSL)
      # - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro    # PROD: uncomment + generate certs first
      - static_data:/app/staticfiles:ro          # Django static files
      - media_data:/app/media:ro                 # Django media uploads
      - frontend_dist:/app/build:ro              # React production build
      - nginx_logs:/var/log/nginx
      # SSL certificates (production only — comment out for dev):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot ACME challenge webroot (for certificate renewal):
      - certbot_webroot:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy                  # ✅ Wait for Django to be ready
      frontend_build:
        condition: service_completed_successfully   # ✅ Wait for npm run build to finish fully
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - curabook_net

  # ── React Frontend Build ──────────────────────────────────────────────────────
  # Runs automatically on every `docker-compose up --build`.
  # Outputs production build to the shared `frontend_dist` volume → nginx serves it.
  # Manual rebuild only: docker-compose run --rm frontend_build
  frontend_build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/build  # Build output mounted to shared volume
      - frontend_node_modules:/app/node_modules  # Cache node_modules separately
    environment:
      # Vite reads VITE_* prefix; REACT_APP_* kept for backward-compat (envPrefix in vite.config.js)
      - VITE_API_URL=${VITE_API_URL:-/api/v1}
      - VITE_WS_URL=${VITE_WS_URL:-/ws}
      # VITE_PROXY_TARGET is only used by Vite dev server, not production build
      # In production, all API calls use VITE_API_URL which is a relative path (/api/v1)
      - VITE_APP_NAME=${VITE_APP_NAME:-CuraBook}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
      - NODE_ENV=production
    command: >
      sh -c "npm install --include=dev &&
             npm run build &&
             test -f /app/build/index.html ||
             (echo '❌ Build failed: index.html missing' && exit 1) &&
             echo '✅ Frontend build complete'"
    # npm install: updates lock file automatically if package.json has new deps
    networks:
      - curabook_net

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A curabook worker
      --loglevel=info
      --concurrency=4
      --queues=default,notifications,emails,reminders,scheduling,analytics
    env_file: .env
    environment:
      DB_HOST:    db
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-curabook.settings.dev}
      SKIP_MIGRATE: "true"
    volumes:
      - logs_data:/app/logs
      - backup_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "curabook", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - curabook_net

  # ── Celery Beat (DB-backed Periodic Tasks) ────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A curabook beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DB_HOST:    db
      REDIS_HOST: redis
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-curabook.settings.dev}
      SKIP_MIGRATE: "true"
    volumes:
      - logs_data:/app/logs
      - backup_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - curabook_net

  # ── Prometheus (Metrics Scraper) ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"   # localhost only — not exposed externally
    depends_on:
      - web
    networks:
      - curabook_net

  # ── Grafana (Monitoring Dashboards) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"   # localhost only (3001 to avoid conflict with React dev)
    depends_on:
      - prometheus
    networks:
      - curabook_net

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  logs_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
  frontend_dist:          # React build output shared between frontend_build and nginx
  frontend_node_modules:  # node_modules cache — avoids reinstalling on every rebuild
  certbot_webroot:        # ACME challenge files for Let's Encrypt certificate renewal
  backup_data:            # Daily PostgreSQL backups (30-day retention)

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  curabook_net:
    driver: bridge