# ─────────────────────────────────────────────────────────────────────────────
# CuraBook — Docker Compose Dev Override
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Dev Port Layout:
#   :5173  → Vite dev server (Frontend HMR)  ← OPEN THIS IN BROWSER
#   :8000  → Django (direct access for Postman / debugging)
#   :3080  → Nginx (API gateway - proxies /api and /ws to Django)
#   :5432  → PostgreSQL
#   :6379  → Redis
#
# Why Vite dev server?
#   :5173 gives instant Hot Module Replacement (HMR).
#   Vite proxies /api → Nginx (:3080) → Django (:8000) — no CORS issues.
# ─────────────────────────────────────────────────────────────────────────────

services:

  web:
    environment:
      DJANGO_SETTINGS_MODULE: curabook.settings.dev
      DEBUG: "True"
    volumes:
      - ./backend:/app          # Hot-reload: mount source code
      # F-12: JWT RSA keys for RS256 signing (bundled dev keys)
      - ./backend/certs/jwt_private_key.pem:/app/certs/jwt_private_key.pem:ro
      - ./backend/certs/jwt_public_key.pem:/app/certs/jwt_public_key.pem:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"             # Expose Django directly for Postman / debugging

  celery_worker:
    environment:
      DJANGO_SETTINGS_MODULE: curabook.settings.dev
    volumes:
      - ./backend:/app

  celery_beat:
    environment:
      DJANGO_SETTINGS_MODULE: curabook.settings.dev
    volumes:
      - ./backend:/app

  db:
    ports:
      - "5432:5432"             # DBeaver / pgAdmin

  redis:
    ports:
      - "6379:6379"             # RedisInsight

  nginx:
    ports:
      - "3080:80"               # API gateway — do NOT use for frontend dev
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - frontend_dist:/app/build:ro

  # ── Frontend Dev Server (Vite HMR) ───────────────────────────────────────────
  # Serves the React app with instant HMR at http://localhost:5173
  # Proxies /api and /ws → Nginx (:3080) → Django (:8000)
  frontend_dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=/api/v1
      - VITE_WS_URL=/ws
      # ✅ FIX #1: كان http://localhost:3080 — داخل Docker containers
      # localhost = نفس الـ container (frontend_dev) مش الـ host machine!
      # الصح: استخدم Docker service name مباشرةً (nginx على port 80 internally)
      - VITE_PROXY_TARGET=http://nginx:80
      - VITE_APP_NAME=CuraBook
      - VITE_APP_VERSION=1.0.0
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    # npm install: handles new packages added to package.json automatically
    depends_on:
      - nginx
    networks:
      - curabook_net
    restart: unless-stopped

  # Override: skip production build in dev (frontend_dev handles serving)
  # ✅ entrypoint override works correctly — profiles: [] does NOT work as an override
  frontend_build:
    entrypoint: ["sh", "-c", "echo '⏭  Dev mode: skipping production build (frontend_dev is running)' && exit 0"]
    command: []
