upstream curabook_app {
    server web:8000;
}

# Dev server — HTTP only, no rate limiting, verbose logging
server {
    listen 80;
    server_name localhost 127.0.0.1;

    client_max_body_size 10M;

    # Explicitly include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── CORS ──────────────────────────────────────────────────────────────────
    # ✅ CORS is handled exclusively by Django (django-cors-headers).
    # Do NOT add Access-Control-* headers here — they would duplicate Django's
    # headers and cause browsers to reject all API calls.

    # Vite assets
    location /assets/ {
        alias /app/build/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React JS/CSS assets (Legacy CRA compatibility)
    location /static/js/ {
        alias /app/build/static/js/;
    }

    location /static/css/ {
        alias /app/build/static/css/;
    }

    # Django static (catch-all for /static/ after more-specific prefixes)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Django media
    location /media/ {
        alias /app/media/;
    }

    # WebSocket — Django Channels
    location /ws/ {
        proxy_pass         http://curabook_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # All API endpoints
    location /api/ {
        # ✅ FIX #3: حُذفت proxy_hide_header تماماً
        # المشكلة كانت: proxy_hide_header بتحذف CORS headers اللي Django بيضيفها
        # بعدين البراوزر بيشوف response من غير Access-Control-Allow-Origin → CORS error
        #
        # الـ OPTIONS preflight كانت بتشتغل (لأنه return 204 قبل ما proxy_hide_header يشتغل)
        # لكن الـ GET/POST/PATCH الحقيقية كانت بتفشل لأن Django بيضيف الـ header
        # وNginx بيحذفه قبل ما يوصل للـ browser
        #
        # الحل: خلي django-cors-headers هو المسؤول الوحيد عن CORS headers — لا تحذفهم

        proxy_pass         http://curabook_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://curabook_app;
        proxy_set_header Host $host;
    }

    # Health
    location /api/v1/health/ {
        proxy_pass http://curabook_app;
        proxy_set_header Host $host;
    }

    # React SPA catch-all — serves production build (when frontend_build has run)
    location / {
        root  /app/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
