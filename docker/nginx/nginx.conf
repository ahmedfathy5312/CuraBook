# ─────────────────────────────────────────────────────────────────────────────
# CuraBook — Nginx Production Config
# Supports: main domain + per-tenant subdomains + SSL + WebSocket
# ─────────────────────────────────────────────────────────────────────────────

upstream curabook_app {
    server web:8000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=100r/m;
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/h;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main Domain: yourdomain.com ───────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name ${DOMAIN:-curabook.com} www.${DOMAIN:-curabook.com};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN:-curabook.com}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN:-curabook.com}/privkey.pem;

    # SSL hardening
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "private";
    }

    # WebSocket upgrade
    location /ws/ {
        proxy_pass          http://curabook_app;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # API with rate limiting
    location /api/v1/auth/login/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://curabook_app;
        include /etc/nginx/includes/proxy_params.conf;
    }

    location /api/v1/contact/ {
        limit_req zone=contact burst=3 nodelay;
        proxy_pass http://curabook_app;
        include /etc/nginx/includes/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://curabook_app;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # Health check — no rate limit, no access log
    location /api/v1/health/ {
        proxy_pass http://curabook_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # Prometheus — internal only
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://curabook_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # React SPA catch-all
    location / {
        root  /app/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ── Per-Tenant Subdomains: *.yourdomain.com ────────────────────────────────────
# كل tenant ممكن يحصل على subdomain خاص: clinic-name.curabook.com
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;

    # Wildcard subdomain — يحتاج wildcard SSL cert (Let's Encrypt Certbot DNS challenge)
    server_name ~^(?<tenant_slug>[a-z0-9-]+)\.${DOMAIN:-curabook.com}$;

    # Wildcard SSL cert (نفس الـ cert بس wildcard)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN:-curabook.com}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN:-curabook.com}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10M;

    # Pass tenant slug to Django via header — TenantMiddleware reads it
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://curabook_app;
        proxy_set_header X-Tenant-Slug $tenant_slug;
        include /etc/nginx/includes/proxy_params.conf;
    }

    location /ws/ {
        proxy_pass         http://curabook_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Tenant-Slug $tenant_slug;
        proxy_read_timeout 3600s;
    }

    # Serve same React SPA — frontend handles tenant branding via API
    location / {
        root  /app/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
