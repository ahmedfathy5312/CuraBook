global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    app: curabook
    env: production

scrape_configs:
  # Django application metrics
  - job_name: 'curabook_django'
    static_configs:
      - targets: ['web:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
