# CuraBook — ELK Stack (Logging & Log Analysis)
# ================================================
# Services: Elasticsearch + Logstash + Kibana
#
# Usage:
#   docker compose -f docker-compose.yml -f docker/elk/docker-compose.elk.yml up
#
# Access:
#   Kibana:         http://localhost:5601
#   Elasticsearch:  http://localhost:9200

version: "3.9"

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: curabook_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false          # disable auth for dev; enable in prod
      - xpack.security.http.ssl.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - curabook_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: curabook_logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"   # Beats input
      - "9600:9600"   # Logstash monitoring
    environment:
      - LS_JAVA_OPTS=-Xmx256m -Xms256m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - curabook_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: curabook_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - curabook_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  elasticsearch_data:
    driver: local

networks:
  curabook_net:
    external: true
