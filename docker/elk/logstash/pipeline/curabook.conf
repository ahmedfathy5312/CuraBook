# CuraBook — Logstash Pipeline
# ==============================
# Ingests Django logs from Filebeat → parses → ships to Elasticsearch

input {
  beats {
    port => 5044
    type => "django"
  }
}

filter {
  # ── Parse Django JSON log format ──────────────────────────────────────────
  if [type] == "django" {
    json {
      source  => "message"
      target  => "django"
      remove_field => ["message"]
    }

    # Extract key fields to top level for easy Kibana filtering
    mutate {
      rename => {
        "[django][level]"      => "log_level"
        "[django][logger]"     => "logger_name"
        "[django][request_id]" => "request_id"
        "[django][user_id]"    => "user_id"
        "[django][path]"       => "http_path"
        "[django][method]"     => "http_method"
        "[django][status]"     => "http_status"
        "[django][duration_ms]" => "duration_ms"
      }
    }

    # Tag slow requests (>500ms) for easy Kibana alert
    if [duration_ms] and [duration_ms] > 500 {
      mutate { add_tag => ["slow_request"] }
    }

    # Tag errors
    if [log_level] in ["ERROR", "CRITICAL"] {
      mutate { add_tag => ["error"] }
    }

    # Parse timestamp
    date {
      match => ["[django][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts  => ["http://elasticsearch:9200"]
    index  => "curabook-logs-%{+YYYY.MM.dd}"
    action => "index"
  }

  # Mirror errors to a dedicated index for quick alerting
  if "error" in [tags] {
    elasticsearch {
      hosts  => ["http://elasticsearch:9200"]
      index  => "curabook-errors-%{+YYYY.MM.dd}"
      action => "index"
    }
  }
}
