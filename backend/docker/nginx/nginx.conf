upstream curabook_app {
    server web:8000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL — mount certs via Docker volume or override in prod
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 10M;

    # ── Static files ──────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # ── WebSocket ─────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://curabook_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;    # 24h WebSocket keep-alive
        proxy_send_timeout 86400;
    }

    # ── Login endpoint — strict rate limit ────────────────
    location /api/v1/auth/login/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://curabook_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://curabook_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── Health check (no rate limit) ──────────────────────
    location /api/v1/health/ {
        proxy_pass http://curabook_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Django Admin ──────────────────────────────────────
    location /admin/ {
        proxy_pass         http://curabook_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Healthcheck (load balancer ping) ──────────────────
    location /ping {
        return 200 "pong\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── Prometheus Metrics — internal only ────────────────
    # Block external access; only allow internal network / monitoring tools
    location /metrics {
        allow 10.0.0.0/8;      # Docker internal network
        allow 172.16.0.0/12;   # Docker bridge networks
        allow 127.0.0.1;       # Localhost
        deny  all;             # Block all external access

        proxy_pass         http://curabook_app;
        proxy_set_header   Host $host;
        access_log         off;
    }
}
