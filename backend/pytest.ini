[pytest]
DJANGO_SETTINGS_MODULE = curabook.settings.dev
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --tb=short
    -q
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=80
    -m "not backup_integration"

markers =
    backup_integration: Real pg_dump + psql restore — run manually before deploy (requires live DB)
