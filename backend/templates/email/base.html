<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — CuraBook</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f7fb; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl; }
    .wrapper { max-width: 600px; margin: 32px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .header { background: linear-gradient(135deg, #1a73e8 0%, #0d5bba 100%); padding: 32px 40px; text-align: center; }
    .header img { height: 40px; margin-bottom: 12px; }
    .header h1 { color: #ffffff; font-size: 22px; margin: 0; font-weight: 600; }
    .body { padding: 36px 40px; }
    .body p { color: #444; font-size: 15px; line-height: 1.7; margin: 0 0 16px; }
    .highlight-box { background: #f0f7ff; border-right: 4px solid #1a73e8; border-radius: 8px; padding: 16px 20px; margin: 20px 0; }
    .highlight-box .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .highlight-box .value { font-size: 16px; color: #1a1a2e; font-weight: 600; margin-top: 4px; }
    .btn { display: inline-block; background: #1a73e8; color: #ffffff !important; text-decoration: none; padding: 12px 28px; border-radius: 8px; font-size: 15px; font-weight: 600; margin: 8px 0; }
    .footer { background: #f9fafb; border-top: 1px solid #e9ecef; padding: 20px 40px; text-align: center; }
    .footer p { color: #999; font-size: 12px; margin: 0; line-height: 1.6; }
    .status-confirmed { color: #0f9d58; font-weight: 700; }
    .status-rejected  { color: #e53935; font-weight: 700; }
    .status-pending   { color: #f4a100; font-weight: 700; }
    .status-cancelled { color: #757575; font-weight: 700; }
    .status-reminder  { color: #1a73e8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>🏥 CuraBook</h1>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>هذا البريد أُرسل تلقائياً من منصة CuraBook.<br>
         لا تقم بالرد على هذا البريد الإلكتروني.</p>
    </div>
  </div>
</body>
</html>
